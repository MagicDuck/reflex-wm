name: Windows release
on:
  pull_request_target:
    types: [closed]
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    # Only execute code that has already been merged into the base repository.
    # This also allows publishing releases for merged PRs from forks.
    if: github.event.pull_request.merged == true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Swift
        shell: pwsh
        run: |
          $swiftVersion = '6.4.0'
          $installerUrl = "https://download.swift.org/swift-$swiftVersion-release/windows10/swift-$swiftVersion-RELEASE/swift-$swiftVersion-RELEASE-windows10.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP "swift-$swiftVersion-installer.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          $installation = Start-Process -FilePath $installerPath `
            -ArgumentList @('/quiet', '/norestart') -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "Swift toolchain installation failed ($($installation.ExitCode))"
          }
          $toolchains = Join-Path $env:LOCALAPPDATA 'Programs\Swift\Toolchains'
          $toolchain = Get-ChildItem $toolchains -Directory |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $toolchain) { throw "Swift toolchain was not found under $toolchains" }
          $platformSdks = Join-Path $env:LOCALAPPDATA 'Programs\Swift\Platforms'
          $platformSdk = Get-ChildItem $platformSdks -Directory |
            Sort-Object LastWriteTime -Descending | ForEach-Object {
              Join-Path $_.FullName 'Windows.platform\Developer\SDKs\Windows.sdk'
            } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $platformSdk) { throw "Windows Swift SDK was not found under $platformSdks" }
          if (-not (Test-Path (Join-Path $platformSdk 'usr\lib\swift\windows'))) {
            throw "Windows Swift standard libraries were not found in $platformSdk"
          }
          $swiftBin = Join-Path $toolchain.FullName 'usr\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $swiftBin
          Add-Content -Path $env:GITHUB_ENV -Value "REFLEX_SWIFT_ROOT=$env:LOCALAPPDATA\Programs\Swift"
          Add-Content -Path $env:GITHUB_ENV -Value "SDKROOT=$platformSdk"
          $env:PATH = "$swiftBin;$env:PATH"
          $env:SDKROOT = $platformSdk
          Write-Host "Using Windows Swift SDK: $env:SDKROOT"
          & (Join-Path $swiftBin 'swift.exe') --version
      - name: Build Windows release
        shell: pwsh
        run: |
          $vcLib = Join-Path $env:VCToolsInstallDir 'lib\x64'
          $sdkVersion = ($env:WindowsSDKVersion).TrimEnd('\')
          $sdkLibRoot = Join-Path $env:WindowsSdkDir "Lib\$sdkVersion"
          $ucrtLib = Join-Path $sdkLibRoot 'ucrt\x64'
          $windowsLib = Join-Path $sdkLibRoot 'um\x64'
          foreach ($library in @('msvcrt.lib', 'oldnames.lib', 'msvcprt.lib')) {
            if (-not (Test-Path (Join-Path $vcLib $library))) {
              throw "MSVC library is missing: $(Join-Path $vcLib $library)"
            }
          }
          foreach ($library in @('ucrt.lib', 'kernel32.lib')) {
            $libraryDirectory = if ($library -eq 'ucrt.lib') { $ucrtLib } else { $windowsLib }
            if (-not (Test-Path (Join-Path $libraryDirectory $library))) {
              throw "Windows SDK library is missing: $(Join-Path $libraryDirectory $library)"
            }
          }
          $env:LIB = (@($vcLib, $ucrtLib, $windowsLib) + @($env:LIB -split ';' | Where-Object { $_ }) |
            Select-Object -Unique) -join ';'
          Write-Host "Using MSVC libraries: $vcLib"
          Write-Host "Using Windows SDK libraries: $ucrtLib; $windowsLib"
          swift build -c release --product reflex-wm
          if ($LASTEXITCODE -ne 0) { throw "Swift release build failed ($LASTEXITCODE)" }
          $binPath = (swift build -c release --show-bin-path | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not locate the Swift release output directory" }
          $executable = Join-Path $binPath 'reflex-wm.exe'
          if (-not (Test-Path $executable)) { throw "Release executable not found: $executable" }
          & $executable --help
          if ($LASTEXITCODE -ne 0) { throw "Release executable smoke check failed ($LASTEXITCODE)" }
          $assetName = 'reflex-wm-windows-x86_64.zip'
          New-Item -ItemType Directory -Force -Path build\release | Out-Null
          Copy-Item $executable build\release\reflex-wm.exe
          $swiftCore = Get-ChildItem $env:REFLEX_SWIFT_ROOT -Filter swiftCore.dll -Recurse -File |
            Select-Object -First 1
          if (-not $swiftCore) { throw 'Swift runtime DLLs were not found in the installed toolchain' }
          Get-ChildItem $swiftCore.DirectoryName -Filter '*.dll' -File |
            Copy-Item -Destination build\release
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "$env:REFLEX_SWIFT_ROOT*" }) -join ';'
          & build\release\reflex-wm.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled release smoke check failed ($LASTEXITCODE)" }
          Compress-Archive -Path build\release\reflex-wm.exe -DestinationPath "build\$assetName" -Force
          Compress-Archive -Path build\release\*.dll -DestinationPath "build\$assetName" -Update
          $hash = (Get-FileHash "build\$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content "build\$assetName.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: reflex-wm-windows-x86_64
          path: |
            build/reflex-wm-windows-x86_64.zip
            build/reflex-wm-windows-x86_64.zip.sha256
          if-no-files-found: error
  release:
    if: github.event.pull_request.merged == true
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.event.pull_request.merge_commit_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reflex-wm-windows-x86_64
          path: release-assets
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        shell: pwsh
        working-directory: release-assets
        run: |
          $tag = "windows-$env:RELEASE_COMMIT"
          'Windows x86_64 release build of reflex-wm.' | Set-Content release-notes.txt -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:RELEASE_COMMIT `
              --title "Windows build $env:RELEASE_COMMIT" --notes-file release-notes.txt
            if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub Release $tag" }
          }
          gh release upload $tag reflex-wm-windows-x86_64.zip `
            reflex-wm-windows-x86_64.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload Windows release assets to $tag" }
